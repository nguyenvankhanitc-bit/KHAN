<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: #e8eef5;
    color: #1a1a1a;
  }

  .wrap {
    max-width: 480px;
    margin: 16px auto;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.12);
    overflow: hidden;
  }

  .header {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #1a73e8;
    color: #fff;
    padding: 14px 16px;
  }

  .header .icon {
    font-size: 22px;
  }

  .header h1 {
    margin: 0;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.3px;
  }

  form {
    padding: 16px;
  }

  label {
    display: block;
    margin: 12px 0 6px;
    font-size: 13px;
    font-weight: 600;
    color: #333;
  }

  input[type='text'],
  input[type='number'],
  select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #d0d7de;
    border-radius: 8px;
    background: #f6f8fa;
    font-size: 14px;
  }

  input:focus,
  select:focus {
    outline: none;
    border-color: #1a73e8;
    background: #fff;
  }

  .row2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .photo-box {
    border: 1px dashed #c5cdd8;
    border-radius: 8px;
    padding: 12px;
    background: #f6f8fa;
  }

  .photo-box input[type='file'] {
    width: 100%;
    font-size: 13px;
  }

  #preview {
    display: block;
    margin-top: 10px;
    max-width: 100%;
    max-height: 180px;
    border-radius: 8px;
    object-fit: contain;
  }

  #btnSave {
    width: 100%;
    margin-top: 18px;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: #1a73e8;
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }

  #btnSave:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  .msg {
    margin: 12px 0 0;
    font-size: 13px;
    min-height: 1.2em;
  }

  .msg.ok {
    color: #137333;
  }

  .msg.err {
    color: #c5221f;
  }
</style>
